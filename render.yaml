# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: claimback
    runtime: python
    plan: free
    region: singapore
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --workers 2 --timeout 60
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL          # Supabase "Session pooler" string
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: FIELD_ENCRYPTION_KEY  # same Fernet key as your .env
        sync: false
      - key: SUPABASE_PROJECT_REF  # e.g. yotnbarwfuivsoecbwnu
        sync: false
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: SUPABASE_S3_REGION
        value: ap-south-1
      - key: SUPABASE_BUCKET
        value: media
      - key: SEED_DEMO
        value: "true"
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
