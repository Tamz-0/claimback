{% extends "base.html" %}
{% block title %}Sign up · Lost & Found{% endblock %}
{% block content %}
<div class="narrow">
  <div class="card">
    <h1>Create account</h1>
    <form method="post">{% csrf_token %}
      {% for field in form %}
        <div class="field">
          <label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}
          {% if field.help_text %}<span class="help">{{ field.help_text|safe }}</span>{% endif %}
          {{ field.errors }}
        </div>
      {% endfor %}
      <button class="btn block">Sign up</button>
    </form>
  </div>
</div>
{% endblock %}
